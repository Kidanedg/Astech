name: Build Iddir Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project structure
        run: |
          mkdir -p /tmp/iddir_project
          flutter create --org com.kidanean /tmp/iddir_project

      - name: Replace generated main.dart with existing app
        run: |
          cp iddirandroid/lib/main.dart /tmp/iddir_project/lib/main.dart

      - name: Copy Flutter project into repository
        run: |
          rm -rf iddirandroid/android
          rm -rf iddirandroid/ios
          rm -rf iddirandroid/linux
          rm -rf iddirandroid/macos
          rm -rf iddirandroid/web
          rm -rf iddirandroid/windows
          cp -r /tmp/iddir_project/android iddirandroid/
          cp -r /tmp/iddir_project/ios iddirandroid/
          cp -r /tmp/iddir_project/linux iddirandroid/
          cp -r /tmp/iddir_project/macos iddirandroid/
          cp -r /tmp/iddir_project/web iddirandroid/
          cp -r /tmp/iddir_project/windows iddirandroid/
          cp /tmp/iddir_project/pubspec.yaml iddirandroid/
          cp /tmp/iddir_project/analysis_options.yaml iddirandroid/
          cp /tmp/iddir_project/.gitignore iddirandroid/

      - name: Get Flutter dependencies
        working-directory: iddirandroid
        run: flutter pub get

      - name: Analyze project
        working-directory: iddirandroid
        run: flutter analyze

      - name: Build Android APK
        working-directory: iddirandroid
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iddir-android-apk
          path: iddirandroid/build/app/outputs/flutter-apk/app-release.apk

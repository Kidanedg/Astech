name: Create Iddir Flutter Project

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          if [ -d "iddirandroid" ]; then
            mv iddirandroid /tmp/old_iddirandroid
          fi

          flutter create \
            --org com.kidanean \
            --project-name iddirandroid \
            iddirandroid

      - name: Restore existing main.dart
        run: |
          if [ -f "/tmp/old_iddirandroid/lib/main.dart" ]; then
            cp /tmp/old_iddirandroid/lib/main.dart iddirandroid/lib/main.dart
          else
            echo "ERROR: Existing main.dart was not found."
            exit 1
          fi

      - name: Get dependencies
        working-directory: iddirandroid
        run: flutter pub get

      - name: Remove generated Flutter test
        run: |
          rm -rf iddirandroid/test

      - name: Analyze Flutter project
        working-directory: iddirandroid
        run: flutter analyze

      - name: Build Android APK
        working-directory: iddirandroid
        run: flutter build apk --release

      - name: Save Flutter project to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add iddirandroid

          git commit -m "Create complete Flutter project for Iddir Android app" || echo "No changes to commit"

          git push

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iddir-android-apk
          path: iddirandroid/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
